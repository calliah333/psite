services:
  sync:
    image: calliahsite-sync
    build: .
    command:
      - "--repo=${GIT_REPO:-https://github.com/calliah333/psite.git}"
      - "--ref=${GIT_REF:-main}"
      - "--root=/git/root"
      - "--link=current"
      - "--period=${GIT_POLL_PERIOD:-10s}"
      - "--init-period=${GIT_INIT_RETRY_PERIOD:-10s}"
      - "--max-failures=${GIT_MAX_FAILURES:-6}"
      - "--init-max-failures=${GIT_INIT_MAX_FAILURES:-6}"
      - "--depth=1"
      - "--http-bind=:2020"
      # git-sync intentionally invokes this once per process, even when the
      # local and remote hashes match. The hook is therefore idempotent.
      - "--exechook-command=/usr/local/bin/build-site"
      - "--exechook-timeout=2m"
    volumes:
      - site-data:/git
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2020/"]
      interval: 10s
      timeout: 2s
      retries: 3
    restart: unless-stopped

  site:
    image: nginx:1.29-alpine
    command:
      - /bin/sh
      - -c
      - "until [ -f /git/site/index.html ]; do sleep 1; done; exec nginx -g 'daemon off;'"
    ports:
      - "${SITE_PORT:-1111}:1111"
    volumes:
      - site-data:/git:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:1111/"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  site-data:
