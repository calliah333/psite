services:
  sync:
    image: calliahsite-sync
    build: .
    command:
      - "--repo=${GIT_REPO:-https://github.com/calliah333/psite.git}"
      - "--ref=${GIT_REF:-main}"
      - "--root=/git/root"
      - "--link=current"
      - "--period=${GIT_POLL_PERIOD:-10s}"
      - "--init-period=${GIT_INIT_RETRY_PERIOD:-10s}"
      - "--max-failures=${GIT_MAX_FAILURES:-6}"
      - "--init-max-failures=${GIT_INIT_MAX_FAILURES:-6}"
      - "--depth=1"
      - "--http-bind=:2020"
      # git-sync intentionally invokes this once per process, even when the
      # local and remote hashes match. The hook is therefore idempotent.
      - "--exechook-command=/usr/local/bin/build-site"
      - "--exechook-timeout=2m"
    volumes:
      - ${SITE_ROOT:-/srv/calliahsite}:/git
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2020/"]
      interval: 10s
      timeout: 2s
      retries: 3
    restart: unless-stopped

